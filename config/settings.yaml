application:
  name: qa-mcp
  environment: local

auth:
  mode: development
  development_subject: local-operator
  development_email: local-operator@localhost
  session_max_age_seconds: 28800
  cookie_secure: false

database:
  path: data/qa_mcp.db
  backup_directory: data/backups
  backup_retention: 14

llm:
  provider: mock
  region: ""
  model_id: ""
  connect_timeout_seconds: 60
  read_timeout_seconds: 180
  retry_mode: standard
  max_attempts: 1

features:
  requirement_analyzer: true
  testcase_generator: true
  testcase_reviewer: true
  jira_connector: false
  github_connector: false
  slack_connector: false
  automation_generator: false

automation_execution:
  base_url: ""
  timeout_seconds: 60
  workspace_root: ""
  keep_workspace: false

jira:
  url: ""
  email: ""
  api_token: ""

github:
  url: "https://api.github.com"
  token: ""
  owner: ""

slack:
  url: "https://slack.com/api"
  token: ""
  default_channel: ""
